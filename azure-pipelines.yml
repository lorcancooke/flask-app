trigger: 
  branches: 
    include: 
      - main    


variables:
  # ---- Cloudsmith settings ----
  CLOUDSMITH_WORKSPACE: 'dmk-software-solutions'  # Cloudsmith workspace slug
  CLOUDSMITH_REPOSITORY: 'signing-demo'
  CLOUDSMITH_SERVICE: 'az-devops'   # Cloudsmith service account slug
  imageName: 'flask-app' # Name of the Docker image to build

steps:
- checkout: self
# Authenticate to Cloudsmith via OIDC (no Entra setup required)
- task: CloudsmithCliSetupAndAuthenticate@1
  displayName: "Cloudsmith: Authenticate via OIDC"
  inputs:
    authMethod: 'oidc'
    oidcAuthOnly: false       # install CLI so 'cloudsmith whoami' works
    pipInstall: false
    cliVersion: ''
    oidcNamespace: '$(CLOUDSMITH_WORKSPACE)'
    oidcServiceSlug: '$(CLOUDSMITH_SERVICE)'

- task: Docker@2 
  displayName: Login to Cloudsmith 
  inputs:
    command: login
    containerRegistry: cloudsmith-docker

- task: Docker@2
  displayName: Build Docker image 
  inputs:
    command: build
    containerRegistry: cloudsmith-docker 
    repository: $(CLOUDSMITH_WORKSPACE)/$(CLOUDSMITH_REPOSITORY)/$(imageName) 
    Dockerfile: '**/Dockerfile'
    arguments: |
      --build-arg CLOUDSMITH_API_KEY=$(CLOUDSMITH_API_KEY) 
      --build-arg CLOUDSMITH_SERVICE=$(CLOUDSMITH_SERVICE)
      --build-arg CLOUDSMITH_WORKSPACE=$(CLOUDSMITH_WORKSPACE)
      --build-arg CLOUDSMITH_REPOSITORY=$(CLOUDSMITH_REPOSITORY)
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Push Docker image to Cloudsmith
  inputs:
    command: push
    repository: $(CLOUDSMITH_WORKSPACE)/$(CLOUDSMITH_REPOSITORY)/$(imageName)
    tags: |
      $(Build.BuildId)
